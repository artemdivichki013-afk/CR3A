name: Build CR3A

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3 for FL Studio
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target CR3A_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CR3A | Out-Null
          Copy-Item -Recurse -Force "build/CR3A_artefacts/Release/VST3/CR3A.vst3" "dist/CR3A/CR3A.vst3"
          Copy-Item -Force "installer/install_windows.bat" "dist/CR3A/install_windows.bat"
          Copy-Item -Force "README.md" "dist/CR3A/README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CR3A-windows-vst3
          path: dist/CR3A
